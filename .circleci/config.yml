version: 2.1

orbs:
  azure-acr: circleci/azure-acr@0.2.3
  azure-cli: circleci/azure-cli@1.3.2
  helm: circleci/helm@3.2.0

jobs:
  update-helm-chart:
    docker:
      - image: cimg/base:2026.10
    steps:
      - run:
          name: Install yq - portable yaml processor
          command: |
            URL=https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
            [ -w /usr/local/bin ] && SUDO="" || SUDO=sudo
            $SUDO wget $URL
            $SUDO mv ./yq_linux_amd64 /usr/local/bin/yq
            $SUDO chmod +x /usr/local/bin/yq
      - checkout
      - run:
          name: Update Values.yaml
          command: |
            export IMAGE_REPOSITORY="$ACR_LOGIN_SERVER/$APP_NAME"
            export CHART_VERSION="0.<< pipeline.number >>.0"
            yq -i '.image.repository = strenv(IMAGE_REPOSITORY)' $CHART_NAME/values.yaml
            yq -i '.image.tag = strenv(CIRCLE_SHA1)' $CHART_NAME/values.yaml
            yq -i '.version = strenv(CHART_VERSION)' $CHART_NAME/Chart.yaml
      - run:
          name: Commit & Push to GitHub
          command: |
            git config user.email "$GITHUB_EMAIL"
            git config user.name "CircleCI User"
            git checkout $CIRCLE_BRANCH           
            git commit -am "Update Values.yaml [skip ci]"
            git push origin $CIRCLE_BRANCH

  package-push-helm-chart:
    docker:
      - image: cimg/base:2026.10
    steps:
      - helm/install_helm_client:
          version: v4.3.1
      - checkout
      - run:
          name: Pull Updated code from repo
          command: git pull origin $CIRCLE_BRANCH
      - run:
          name: Packaging the Helm Chart
          command: helm package $CHART_NAME
      - run:
          name: Login to Helm Registry
          command: echo "$ACR_PASSWORD" | helm registry login $ACR_LOGIN_SERVER --username $ACR_USERNAME --password-stdin
      - run:
          name: Pushing Helm chart to registry
          command: helm push "$CHART_NAME-0.<< pipeline.number >>.0.tgz" "oci://$ACR_LOGIN_SERVER/helm"

  install-helm-chart:
    docker:
      - image: cimg/base:2026.10
    parameters:
      cluster-name:
        description: |
          Name of the AKS cluster
        type: string
      resource-group:
        description: |
          Resource group that the cluster is in
        type: string
    steps:
      - checkout
      - run:
          name: Pull Updated code from repo
          command: git pull origin $CIRCLE_BRANCH
      - azure-cli/install
      - run:
          name: Log in to Azure with the service principal
          command: az login --service-principal --tenant "$AZURE_SP_TENANT" --username "$AZURE_SP" --password "$AZURE_SP_PASSWORD" --output none
      - run:
          name: Get AKS credentials
          command: az aks get-credentials --resource-group << parameters.resource-group >> --name << parameters.cluster-name >>
      - helm/install_helm_client:
          version: v4.3.1
      - run:
          name: Login to Helm Registry
          command: echo "$ACR_PASSWORD" | helm registry login $ACR_LOGIN_SERVER --username $ACR_USERNAME --password-stdin
      - run:
          name: helm install
          command: bash ./script.sh "0.<< pipeline.number >>.0" $NAMESPACE $CHART_NAME $ACR_LOGIN_SERVER

workflows:
  Deploy-App-on-AKS:
    jobs:
      - azure-acr/build-and-push-image:
          executor:
            name: azure-acr/default
            image: ubuntu-2404:current
          login-server-name: $ACR_LOGIN_SERVER
          registry-name: $ACR_REGISTRY_NAME
          repo: $APP_NAME
          tag: $CIRCLE_SHA1,latest
      - update-helm-chart:
          requires:
            - azure-acr/build-and-push-image
      - package-push-helm-chart:
          requires:
            - update-helm-chart
      - install-helm-chart:
          cluster-name: $CLUSTER_NAME
          resource-group: $RESOURCE_GROUP
          requires:
            - package-push-helm-chart
